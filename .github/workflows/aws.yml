#      run: chmod +x gradlew
#
##    - name: Clean with Gradle
##      run: gradlew clean build
##
##    - name: Upload Build Artifacts
##      uses: actions/upload-artifact@v3
##      with:
##        name: build-libs
##        path: build/libs/*.jar
##
##    - name: Grant eurekaserver execute permission for gradlew
##      run: chmod +x com.hobbing.eurekaserver/gradlew
##
