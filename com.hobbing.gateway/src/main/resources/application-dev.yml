server:
  port: 19006

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: user
          uri: lb://user
          predicates:
            - Path=/users/**
          filters:
            - name: UserAuthorizationFilter

        - id: lecture
          uri: lb://lecture
          predicates:
            - Path=/lectures/**, /waitinglist/**
          filters:
            - name: LectureAuthorizationFilter

        - id: coupon
          uri: lb://coupon
          predicates:
            - Path=/coupons/**, /users/me/coupons
          filters:
            - name: CouponAuthorizationFilter

        - id: reservation
          uri: lb://reservation
          predicates:
            - Path=/reservations/**, /payments/**, settlements/**
          filters:
            - name: ReservationAuthorizationFilter

      discovery:
        locator:
          enabled: true
  cache:
    type: caffeine
    cache-names:
      - loadbalancer
    caffeine:
      spec: maximumSize=500,expireAfterAccess=300s

  config:
    import: classpath:application-key.yml

eureka:
  client:
    service-url:
      defaultZone: http://hobbing-eureka:19000/eureka/
  instance:
    lease-renewal-interval-in-seconds: 30  # heartbeat 주기
    lease-expiration-duration-in-seconds: 60  # 만료 시간
#    initial-status: UP
#    metadata-map:
#      region: ap-northeast-2

management:
  endpoints:
    web:
      exposure:
        include: "*"

service:
  internal:
    internal-key: ${INTERNAL-KEY}