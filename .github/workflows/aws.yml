##      uses: actions/upload-artifact@v3
##      with:
##        name: com.hobbing.eurekaserver/build-libs
##        path: com.hobbing.eurekaserver/build/libs/*.jar
#==========================================end
  deploy:
    needs: build
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4
#==========================================start  
#    - name: Download Build Artifacts
#      uses: actions/download-artifact@v3
#      with:
#        name: build-libs
#        path: build/libs
#==========================================end
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build dock-compose.yml
      run: docker compose build

    - name: Build, tag, and push image to Amazon ECR
      id: eureka-server-image
      env:
        ECR_REGISTRY: hobbing
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker tag ${{ env.ECR_REGISTRY }}/eureka-server:latest docker.io/hobbing/eureka-server
        docker push ${{ env.ECR_REGISTRY }}/eureka-server:latest

    - name: Build, tag, and push image to Amazon ECR
      id: proxy-gateway-image
      env:
        ECR_REGISTRY: hobbing
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker tag docker.io/hobbing/proxy-gateway ${{ env.ECR_REGISTRY }}/proxy-gateway:${{ env.IMAGE_TAG }}
        docker push ${{ env.ECR_REGISTRY }}/proxy-gateway:${{ env.IMAGE_TAG }}

    - name: Build, tag, and push image to Amazon ECR
      id: gateway-image
      env:
        ECR_REGISTRY: hobbing
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker tag docker.io/hobbing/gateway ${{ env.ECR_REGISTRY }}/gateway:${{ env.IMAGE_TAG }}
        docker push ${{ env.ECR_REGISTRY }}/gateway:${{ env.IMAGE_TAG }}


    - name: Build, tag, and push image to Amazon ECR
      id: user-image
      env:
        ECR_REGISTRY: hobbing
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker tag docker.io/hobbing/user ${{ env.ECR_REGISTRY }}/user:${{ env.IMAGE_TAG }}
        docker push ${{ env.ECR_REGISTRY }}/user:${{ env.IMAGE_TAG }}
#        # Build a docker container and
#        # push it to ECR so that it can
#        # be deployed to ECS.
#        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY/eurekaserver:$IMAGE_TAG ./com.hobbing.eurekaserver/
#        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
#        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
    - name: Fill in the new image ID in the Amazon ECS task definition
      id: eureka-server-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.eureka-server-image.outputs.image }}
    - name: Fill in the new image ID in the Amazon ECS task definition
      id: proxy-gateway-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.proxy-gateway-image.outputs.image }}
    - name: Fill in the new image ID in the Amazon ECS task definition
      id: gateway-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.gateway-imagee.outputs.image }}
    - name: Fill in the new image ID in the Amazon ECS task definition
      id: user-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.user-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.eureka-server-task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.proxy-gateway-task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.gateway-task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.user-task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
