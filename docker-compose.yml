networks:
  hobbing-network:
    driver: bridge

services:
  eureka-server:
    build:
      context: ./
      dockerfile: com.hobbing.eurekaserver/Dockerfile
    image: eureka-server:latest
    ports:
      - "19000:19000"
    networks:
      - hobbing-network

  coupon:
    build:
      context: ./
      dockerfile: com.hobbing.coupon/Dockerfile
    image: coupon:latest
    ports:
      - "19040:19040"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://hobbing-elb-1223327969.ap-northeast-2.elb.amazonaws.com:80/eureka/
    networks:
      - hobbing-network

  gateway:
    build:
      context: ./
      dockerfile: com.hobbing.gateway/Dockerfile
    image: gateway:latest
    ports:
      - "19006:19006"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://hobbing-elb-1223327969.ap-northeast-2.elb.amazonaws.com:80/eureka/
    networks:
      - hobbing-network

  proxy-gateway:
    build:
      context: ./
      dockerfile: com.hobbing.proxygateway/Dockerfile
    image: proxy-gateway:latest
    ports:
      - "19005:19005"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://hobbing-elb-1223327969.ap-northeast-2.elb.amazonaws.com:80/eureka/
    networks:
      - hobbing-network

  reservation-pay:
    build:
      context: ./
      dockerfile: com.hobbing.reservation-pay/Dockerfile
    image: reservation-pay:latest
    ports:
      - "19050:19050"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://hobbing-elb-1223327969.ap-northeast-2.elb.amazonaws.com:80/eureka/
    networks:
      - hobbing-network

  user:
    build:
      context: ./
      dockerfile: com.hobbing.user/Dockerfile
    image: user:latest
    ports:
      - "19020:19020"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://hobbing-elb-1223327969.ap-northeast-2.elb.amazonaws.com:80/eureka/
    networks:
      - hobbing-network

  lecture:
    build:
      context: ./
      dockerfile: com.hobbing.lecture/Dockerfile
    image: lecture:latest
    ports:
      - "19030:19030"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://hobbing-elb-1223327969.ap-northeast-2.elb.amazonaws.com:80/eureka/
    networks:
      - hobbing-network


