spring:
  config:
    import: classpath:application-key.yml
  application.name: reservation-pay
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties.hibernate:
      show_sql: true
      format_sql: true
      use_sql_comments: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}     # local url
    username: ${DB_USER}
    password: ${DB_PASSWORD}
#  sql.init.platform: postgres

service:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-expiration: 1800000
  internal:
    internal-key: ${INTERNAL-KEY}

server:
  port: 19050

eureka:
  client:
    service-url:
      defaultZone: http://hobbing-elb-1223327969.ap-northeast-2.elb.amazonaws.com:80/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    lease-renewal-interval-in-seconds: 30  # heartbeat 주기
    lease-expiration-duration-in-seconds: 90  # 만료 시간
    hostname: reservation-pay

logging:
  level:
    org:
      hibernate:
        engine.jdbc.env.internal.JdbcEnvironmentInitiator: DEBUG
        SQL: DEBUG
      springframework:
        web: DEBUG
        http.converter: DEBUG
        beans.factory: DEBUG
        jdbc.datasource: DEBUG
