server:
  port: 19020

spring:
  config:
    import:
      file: ./.env

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 1000
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: systempass

service:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-expiration: 1800000
  internal:
    internal-key: ${INTERNAL-KEY}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19000/eureka/
