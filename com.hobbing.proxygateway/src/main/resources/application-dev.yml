server:
  port: 19005

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: user
          uri: lb://user
          predicates:
            - Path=/auths/**

        - id: gateway
          uri: lb://gateway
          predicates:
            - Path=/**

      discovery:
        locator:
          enabled: true

  cache:
    type: caffeine
    cache-names:
      - loadbalancer
    caffeine:
      spec: maximumSize=500,expireAfterAccess=300s

  config:
    import: classpath:application-key.yml
    
eureka:
  client:
    service-url:
      defaultZone: http://localhost:19000/eureka/
  instance:
#    initial-status: UP
    lease-renewal-interval-in-seconds: 60  # heartbeat 주기
    lease-expiration-duration-in-seconds: 180  # 만료 시간
#    metadata-map:
#      region: ap-northeast-2

service:
  jwt:
    secret-key: ${SECRET-KEY}
    access-expiration: 1800000 # 30분
  internal:
    internal-key: ${INTERNAL-KEY}

management:
  endpoints:
    web:
      exposure:
        include: "*"

