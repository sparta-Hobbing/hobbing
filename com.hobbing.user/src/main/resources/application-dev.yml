server:
  port: 19020

spring:
  config:
    import:
      file: ./.env

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 1000
    open-in-view: false
  data:
    redis:
      host: redis
      port: 6379
      database: 0
      username: ${REDIS_USER}
      password: ${REDIS_PASSWORD}

#  cache:
#    type: caffeine
#    cache-names:
#      - loadbalancer
#    caffeine:
#      spec: maximumSize=500,expireAfterAccess=300s

service:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-expiration: 1800000
  internal:
    internal-key: ${INTERNAL-KEY}

eureka:
  client:
    service-url:
      defaultZone: http://hobbing-elb-1223327969.ap-northeast-2.elb.amazonaws.com:80/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    lease-renewal-interval-in-seconds: 30  # heartbeat 주기
    lease-expiration-duration-in-seconds: 90  # 만료 시간
    hostname: user
#    initial-status: UP
#    metadata-map:
#      region: ap-northeast-2

security:
  basic:
    enabled: false